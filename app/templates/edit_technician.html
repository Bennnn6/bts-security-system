{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <!-- HEADER -->
            <div class="card-header bg-primary text-white text-center">

                <h4 class="mb-0">
                    Edit Data Teknisi
                </h4>

            </div>


            <div class="card-body">

                <!-- DATA TEKNISI -->
                <div class="alert alert-info">

                    <strong>
                        ID Teknisi:
                    </strong>

                    {{ technician.technician_id }}

                </div>


                <!-- FORM -->
                <form
                    method="POST"
                    action="{{ url_for(
                        'edit_technician',
                        tech_id=technician.technician_id
                    ) }}"
                >

                    <!-- NAMA -->
                    <div class="mb-3">

                        <label
                            for="name"
                            class="form-label fw-bold"
                        >
                            Nama Teknisi
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            value="{{ technician.name }}"
                            required
                        >

                    </div>


                    <!-- USERNAME -->
                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label fw-bold"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            value="{{ technician.username or '' }}"
                            required
                        >

                    </div>


                    <!-- POSISI -->
                    <div class="mb-3">

                        <label
                            for="position"
                            class="form-label fw-bold"
                        >
                            Posisi
                        </label>

                        <input
                            type="text"
                            id="position"
                            name="position"
                            class="form-control"
                            value="{{ technician.position }}"
                            required
                        >

                    </div>


                    <!-- NOMOR TELEPON -->
                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label fw-bold"
                        >
                            Nomor Telepon
                        </label>

                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            class="form-control"
                            value="{{ technician.phone }}"
                            required
                        >

                    </div>


                    <!-- STATUS -->
                    <div class="mb-4">

                        <label
                            for="status"
                            class="form-label fw-bold"
                        >
                            Status Teknisi
                        </label>

                        <select
                            id="status"
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value="Active"
                                {% if technician.status == 'Active' %}
                                selected
                                {% endif %}
                            >
                                Active
                            </option>

                            <option
                                value="Inactive"
                                {% if technician.status == 'Inactive' %}
                                selected
                                {% endif %}
                            >
                                Inactive
                            </option>

                        </select>

                    </div>


                    <!-- BUTTON -->
                    <div class="d-grid gap-2">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg"
                        >

                            Simpan Perubahan

                        </button>


                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-outline-secondary"
                        >

                            <i class="bi bi-arrow-left me-1"></i> Kembali ke Dashboard

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
