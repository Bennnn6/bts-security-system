name: Python application

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Sistem operasi server GitHub Actions

    steps:
    - uses: actions/checkout@v4 # Mengambil kode dari repository-mu
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Sesuaikan dengan versi Python yang kamu pakai
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run main script / test
      run: |
        python main.py # Ganti dengan perintah untuk menjalankan test atau sistem bts kamu
