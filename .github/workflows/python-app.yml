name: Python application

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'android_technician_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest # Sistem operasi server GitHub Actions

    steps:
    - uses: actions/checkout@v4 # Mengambil kode dari repository-mu
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Sesuaikan dengan versi Python yang kamu pakai
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libopenblas-dev liblapack-dev libgl1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run system verification tests
      run: |
        python test_system.py
